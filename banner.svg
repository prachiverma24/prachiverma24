<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00fff2"/>
      <stop offset="50%" stop-color="#a259ff"/>
      <stop offset="100%" stop-color="#ff2ec4"/>
    </linearGradient>
    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2ec4"/>
      <stop offset="50%" stop-color="#00fff2"/>
      <stop offset="100%" stop-color="#a259ff"/>
    </linearGradient>
    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowPink" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .bgrect { fill: #05050a; }
      .title {
        font-family: 'Courier New', monospace;
        font-weight: 700;
        font-size: 46px;
        fill: #eafcff;
        text-anchor: middle;
      }
      .sub {
        font-family: 'Courier New', monospace;
        font-weight: 600;
        font-size: 20px;
        letter-spacing: 2px;
        text-anchor: middle;
      }
      .wave1 {
        animation: driftLeft 9s linear infinite;
      }
      .wave2 {
        animation: driftRight 13s linear infinite;
      }
      @keyframes driftLeft {
        0% { transform: translateX(0); }
        100% { transform: translateX(-600px); }
      }
      @keyframes driftRight {
        0% { transform: translateX(-600px); }
        100% { transform: translateX(0); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.6; }
      }
      .glowText {
        animation: pulseGlow 3.2s ease-in-out infinite;
      }
      .dot {
        animation: pulseGlow 1.6s ease-in-out infinite;
      }
    </style>
  </defs>

  <rect class="bgrect" x="0" y="0" width="1200" height="300"/>

  <g opacity="0.35">
    <path class="wave1" d="M0 240 Q 150 210 300 240 T 600 240 T 900 240 T 1200 240 T 1500 240 T 1800 240 V300 H0 Z" fill="url(#waveGrad1)"/>
  </g>
  <g opacity="0.25">
    <path class="wave2" d="M0 260 Q 150 285 300 260 T 600 260 T 900 260 T 1200 260 T 1500 260 T 1800 260 V300 H0 Z" fill="url(#waveGrad2)"/>
  </g>

  <circle class="dot" cx="80" cy="60" r="4" fill="#00fff2" filter="url(#glowCyan)"/>
  <circle class="dot" cx="1120" cy="70" r="4" fill="#ff2ec4" filter="url(#glowPink)" style="animation-delay:0.7s"/>
  <circle class="dot" cx="1080" cy="230" r="3" fill="#a259ff" filter="url(#glowPink)" style="animation-delay:1.2s"/>
  <circle class="dot" cx="70" cy="220" r="3" fill="#00fff2" filter="url(#glowCyan)" style="animation-delay:0.4s"/>

  <text x="600" y="130" class="title glowText" filter="url(#glowCyan)">Hi 👋, I'm Prachi Verma</text>
  <text x="600" y="175" class="sub glowText" fill="#ff2ec4" filter="url(#glowPink)" style="animation-delay:0.3s">FULL STACK DEVELOPER · MERN STACK</text>

  <line x1="440" y1="200" x2="760" y2="200" stroke="#a259ff" stroke-width="2" filter="url(#glowPink)" class="glowText"/>
</svg>
